# Config for the ROOT test suite (test/) -- pipeline integration tests.
#
# The app's own unit tests have their own config in app/pyproject.toml and a different
# rootdir. They are kept separate deliberately: unit tests need no stack and must stay
# fast, integration tests need the whole thing running. scripts/test.sh runs both.
[pytest]
testpaths = test
addopts = -q --strict-markers
markers =
    integration: requires a running stack (scripts/up.sh)
