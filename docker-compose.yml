# Base stack. This file must reflect the HONEST resting footprint of the pipeline --
# load generators live in docker-compose.load.yml and the test harness in
# docker-compose.test.yml, so that `docker stats` against this file alone is a
# measurement we can quote.
#
# Phase 1 brings up storage only. The Collector joins in Phase 2, the app in Phase 3.

name: adaptive-edge-otel

# Memory limits are enforced, not aspirational: the thesis of this project is that
# edge processing keeps backends small, so a backend that needs more than its budget
# is a finding, not a config to loosen.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- the point of the project ------------------------------------------
  # The only component that accepts telemetry from outside. Everything it forwards
  # has already been through the processor chain, which is what keeps the backends
  # below small.
  collector:
    image: ${COLLECTOR_IMAGE}
    container_name: aeo-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/${COLLECTOR_CONFIG}"]
    environment:
      # Referenced as ${env:...} inside the collector config. Kept below
      # COLLECTOR_MEM_LIMIT so memory_limiter refuses work and backpressures the
      # sender before Docker OOM-kills the container.
      COLLECTOR_MEMORY_LIMIT_MIB: ${COLLECTOR_MEMORY_LIMIT_MIB}
      COLLECTOR_MEMORY_SPIKE_MIB: ${COLLECTOR_MEMORY_SPIKE_MIB}
      TAIL_SAMPLING_SLOW_THRESHOLD_MS: ${TAIL_SAMPLING_SLOW_THRESHOLD_MS}
      TAIL_SAMPLING_BASELINE_PCT: ${TAIL_SAMPLING_BASELINE_PCT}
      TAIL_SAMPLING_DECISION_WAIT: ${TAIL_SAMPLING_DECISION_WAIT}
    ports:
      - "${OTLP_GRPC_PORT}:4317"
      - "${OTLP_HTTP_PORT}:4318"
      - "${COLLECTOR_METRICS_PORT}:8888"   # self-telemetry: accepted vs sent counters
      - "${COLLECTOR_HEALTH_PORT}:13133"   # health_check extension, probed host-side
    volumes:
      - ./collector/config:/etc/otelcol:ro
    mem_limit: ${COLLECTOR_MEM_LIMIT}
    # Wait for the backends: a Collector that starts first will log export failures
    # and drop the first batches, which looks exactly like a broken pipeline when it
    # is really just a race at boot.
    depends_on:
      - victoriametrics
      - loki
      - tempo
    # No container healthcheck: this image is fully distroless (no shell, no wget,
    # no curl), so any `test:` here would either fail to exec or amount to running
    # the binary with --help, which proves nothing about readiness. The health_check
    # extension is published on 13133 and probed from the host by scripts/smoke.sh
    # instead -- same approach as VictoriaMetrics, which is distroless for the same
    # reason.
    logging: *default-logging

  # --- the workload ------------------------------------------------------
  # Emits all three signals through the Collector, never directly to a backend.
  # /simulate/flood triggers the controlled incident the measurement runs against.
  app:
    build:
      context: ./app
    image: aeo-edgeapp:local
    container_name: aeo-app
    restart: unless-stopped
    environment:
      SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      APP_ERROR_RATE: ${APP_ERROR_RATE}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL}
      FLOOD_DURATION_SECONDS: ${FLOOD_DURATION_SECONDS}
      FLOOD_LOGS_PER_SECOND: ${FLOOD_LOGS_PER_SECOND}
      FLOOD_UNIQUE_LABELS_PER_SECOND: ${FLOOD_UNIQUE_LABELS_PER_SECOND}
    ports:
      - "${APP_PORT}:8000"
    mem_limit: ${APP_MEM_LIMIT}
    depends_on:
      - collector
    healthcheck:
      # A real readiness check, unlike the distroless services: this image has a
      # Python interpreter, so it can actually exercise the HTTP endpoint. Without it
      # `compose up --wait` returns as soon as the container is running, and
      # measure.sh would start driving load before uvicorn is serving.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging: *default-logging

  # --- metrics ------------------------------------------------------------
  victoriametrics:
    image: ${VICTORIAMETRICS_IMAGE}
    container_name: aeo-victoriametrics
    restart: unless-stopped
    command:
      - --httpListenAddr=:8428
      - --retentionPeriod=${VM_RETENTION_PERIOD}
      # VM sizes its caches from available memory. Left alone it would claim ~60% of
      # the cgroup limit for caches and then get OOM-killed by the remaining
      # allocation pressure; 40% leaves real headroom under a 200MB ceiling.
      - --memory.allowedPercent=40
      - --loggerLevel=WARN
      # Accept OTLP directly as well as remote-write. Not used by default (the
      # Collector remote-writes), but it makes the backend swappable later without
      # touching the pipeline shape.
      - --opentelemetry.usePrometheusNaming=true
    ports:
      - "${VICTORIAMETRICS_PORT}:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    mem_limit: ${VM_MEM_LIMIT}
    logging: *default-logging

  # --- logs ---------------------------------------------------------------
  loki:
    image: ${LOKI_IMAGE}
    container_name: aeo-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    environment:
      # Go's soft memory limit. Set below mem_limit so the GC works harder as the
      # heap approaches the ceiling instead of letting Docker hard-kill the process.
      # Graceful degradation beats an OOM kill in an observability backend -- losing
      # the thing that tells you what went wrong is the worst possible failure mode.
      GOMEMLIMIT: 160MiB
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./storage/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    mem_limit: ${LOKI_MEM_LIMIT}
    logging: *default-logging

  # --- traces -------------------------------------------------------------
  tempo:
    image: ${TEMPO_IMAGE}
    container_name: aeo-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      GOMEMLIMIT: 160MiB
    ports:
      # Query API only. Tempo's OTLP receivers (4317/4318) are deliberately NOT
      # published -- they would collide with the Collector, which is the only
      # component that should accept telemetry from outside.
      - "${TEMPO_QUERY_PORT}:3200"
    volumes:
      - ./storage/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: ${TEMPO_MEM_LIMIT}
    logging: *default-logging

  # --- optional UI --------------------------------------------------------
  # Not in the default stack: Grafana costs more RAM than any single backend here,
  # which cuts directly against the thing this project is demonstrating. Start it
  # explicitly with `--profile ui`, and never leave it running while measuring.
  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: aeo-grafana
    restart: unless-stopped
    profiles: ["ui"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [victoriametrics, loki, tempo]
    logging: *default-logging

volumes:
  vm-data:
  loki-data:
  tempo-data:
  grafana-data:
